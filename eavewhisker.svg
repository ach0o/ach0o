<svg xmlns="http://www.w3.org/2000/svg" width="420" height="520" viewBox="0 0 420 520">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&amp;display=swap');
      .card-bg { fill: #0c1120; }
      .card-border { fill: none; stroke: #3a3f6e; stroke-width: 1.5; rx: 8; }
      .text { font-family: 'JetBrains Mono', 'Courier New', monospace; fill: #8b8ec5; }
      .text-bold { font-family: 'JetBrains Mono', 'Courier New', monospace; fill: #8b8ec5; font-weight: 700; }
      .text-dim { font-family: 'JetBrains Mono', 'Courier New', monospace; fill: #5a5d8a; }
      .bar-fill { fill: #8b8ec5; }
      .bar-empty { fill: #1a1f35; }
      .quote-border { fill: none; stroke: #3a3f6e; stroke-width: 1; rx: 6; }
    </style>
  </defs>

  <rect class="card-bg" width="420" height="520" rx="10"/>
  <rect class="card-border" x="8" y="8" width="404" height="504" rx="8"/>

  <!-- Header -->
  <text class="text-bold" x="28" y="42" font-size="13">&#9733;&#9733;&#9733; RARE</text>
  <text class="text-bold" x="330" y="42" font-size="13">RABBIT</text>

  <!-- ASCII Bunny -->
  <text class="text" x="100" y="82" font-size="15">,&gt;</text>
  <text class="text" x="82" y="100" font-size="15">(\__/)</text>
  <text class="text" x="74" y="118" font-size="15">( &#10022;  &#10022; )</text>
  <text class="text" x="66" y="136" font-size="15">=(  ..  )=</text>
  <text class="text" x="74" y="154" font-size="15">(")\_\_(")</text>

  <!-- Name -->
  <text class="text-bold" x="28" y="190" font-size="14">Eavewhisker</text>

  <!-- Description -->
  <text class="text-dim" x="28" y="218" font-size="10.5">"An insufferably patient rabbit who</text>
  <text class="text-dim" x="28" y="233" font-size="10.5">watches your buggy code with wide eyes</text>
  <text class="text-dim" x="28" y="248" font-size="10.5">and quiet sighs, only occasionally</text>
  <text class="text-dim" x="28" y="263" font-size="10.5">pointing out the obvious flaw you've</text>
  <text class="text-dim" x="28" y="278" font-size="10.5">overlooked three times, delivered with</text>
  <text class="text-dim" x="28" y="293" font-size="10.5">surgical snark that stings because</text>
  <text class="text-dim" x="28" y="308" font-size="10.5">she's always right."</text>

  <!-- Stats -->
  <text class="text" x="28" y="342" font-size="11">DEBUGGING</text>
  <rect class="bar-empty" x="130" y="332" width="200" height="12" rx="3"/>
  <rect class="bar-fill" x="130" y="332" width="62" height="12" rx="3"/>
  <text class="text" x="340" y="342" font-size="11">31</text>

  <text class="text" x="28" y="362" font-size="11">PATIENCE</text>
  <rect class="bar-empty" x="130" y="352" width="200" height="12" rx="3"/>
  <rect class="bar-fill" x="130" y="352" width="188" height="12" rx="3"/>
  <text class="text" x="340" y="362" font-size="11">94</text>

  <text class="text" x="28" y="382" font-size="11">CHAOS</text>
  <rect class="bar-empty" x="130" y="372" width="200" height="12" rx="3"/>
  <rect class="bar-fill" x="130" y="372" width="34" height="12" rx="3"/>
  <text class="text" x="340" y="382" font-size="11">17</text>

  <text class="text" x="28" y="402" font-size="11">WISDOM</text>
  <rect class="bar-empty" x="130" y="392" width="200" height="12" rx="3"/>
  <rect class="bar-fill" x="130" y="392" width="64" height="12" rx="3"/>
  <text class="text" x="340" y="402" font-size="11">32</text>

  <text class="text" x="28" y="422" font-size="11">SNARK</text>
  <rect class="bar-empty" x="130" y="412" width="200" height="12" rx="3"/>
  <rect class="bar-fill" x="130" y="412" width="128" height="12" rx="3"/>
  <text class="text" x="340" y="422" font-size="11">64</text>

  <!-- Last said -->
  <text class="text-dim" x="28" y="452" font-size="10">last said</text>
  <rect class="quote-border" x="28" y="460" width="364" height="44"/>
  <text class="text" x="38" y="478" font-size="10.5">*ears twitch, nose wiggles*</text>
  <text class="text" x="38" y="494" font-size="10.5">"Ah. A blank canvas. How...</text>
  <text class="text" x="38" y="508" font-size="10.5"> optimistically terrifying."</text>
</svg>